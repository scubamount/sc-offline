name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default to read; only the release job asks for write.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2

      - name: Restore NuGet packages
        run: nuget restore ChrisWareOffline.slnx

      - name: Build (Release x64)
        run: msbuild ChrisWareOffline.slnx /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload DLL artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dinput8-release
          path: x64/Release/dinput8.dll
          retention-days: 30

      - name: Upload PDB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dinput8-pdb
          path: x64/Release/dinput8.pdb
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download DLL artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dinput8-release
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/dinput8.dll
          generate_release_notes: true
          # v1.x and later are real releases; every other tag ships as a
          # pre-release, so an unfinished build can never look like the
          # recommended download. Flip by tagging v1.0.0.
          prerelease: ${{ !startsWith(github.ref_name, 'v1.') }}
          body: |
            **Built from this repository's source** — commit `${{ github.sha }}` on
            `${{ github.ref_name }}`. This is *not* the prebuilt `dinput8.dll` at the
            repo root, which came from the mod's original author; the two binaries
            differ. See the README's **Which DLL do I run?** section.

            Install it exactly as the README's Setup section says, then play with
            **M** → **Squadron 42**.

            Every runtime path in a release is unproven until someone has run it.
            If something breaks, send back the matching lines from `mod.log` and
            `Game.log`.
