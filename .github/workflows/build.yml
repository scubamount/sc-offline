name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ChrisWareOffline.slnx

      - name: Build (Release x64)
        run: msbuild ChrisWareOffline.slnx /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: dinput8-release
          path: x64/Release/dinput8.dll
          retention-days: 30

      - name: Upload PDB artifact
        uses: actions/upload-artifact@v4
        with:
          name: dinput8-pdb
          path: x64/Release/dinput8.pdb
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download DLL artifact
        uses: actions/download-artifact@v4
        with:
          name: dinput8-release
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/dinput8.dll
          generate_release_notes: true
