; discord: shows "Playing sc-offline" on your Discord profile while the game runs: the version this
; host reports, where you are and the ship you are aboard. Talks only to the Discord app on this PC
; (its local pipe); nothing goes over the network. On by default; turn it off in the launcher's
; Plugins page (it creates an empty file named "disabled" here). Format: docs/plugin-ini.md in the sco SDK.
id = discord
name = Discord status
version = 1.0.0
author = sc-offline
api = 1.1
kind = native
entry = discord.dll

[settings]
show_location = bool default true label "Show where you are" help "The moon, planet or station you are at"
show_ship     = bool default true label "Show your ship" help "The ship you are aboard"
show_buttons  = bool default true label "Show buttons" help "Join the Discord and Get sc-offline buttons on your profile"
